name: CI
on:
  push:
  pull_request:

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_keywords.py keywords/public-boundary.txt .
      - run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install '.[dev,ux]'
      - run: .venv/bin/ruff check src tests tools
      - run: .venv/bin/ruff format --check src tests tools
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest
      - run: .venv/bin/python tools/check_sources.py
