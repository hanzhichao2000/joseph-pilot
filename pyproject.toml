[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joseph-pilot"
version = "0.1.0"
description = "Minimal Joseph runtime host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings==2.13.1",
    "joseph-api @ git+https://github.com/hanzhichao2000/joseph-api.git@2e3dac1ecb3320acabb148289d8c892022a7b841",
    "joseph-dal @ git+https://github.com/hanzhichao2000/joseph-dal.git@5a75ad97f792d2d5b9eb6c9be203b88078543f3f",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.6", "mypy==2.4.1"]
ux = ["rich==14.3.3", "vectorbt==0.28.1", "matplotlib>=3.8", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
joseph-pilot = "joseph_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = ["src/joseph_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
